openapi: 3.0.1
info:
  title: PaymentsAPI
  description: API Definition of PaymentsAPI
  version: 1.0.0
servers:
  - url: http://localhost:8290/payments
  - url: https://localhost:8253/payments
paths:
  /:
    get:
      responses:
        default:
          description: Default response
    post:
      requestBody:
        description: Sample Payload
        content:
          application/json:
            schema:
              type: object
              properties:
                payload:
                  type: object
          application/xml:
            schema:
              type: object
              xml:
                name: payload
        required: false
      responses:
        default:
          description: Default response
  /id/{paymentId}:
    get:
      parameters:
        - name: paymentId
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: string
      responses:
        default:
          description: Default response
  /{policyId}:
    get:
      parameters:
        - name: policyId
          in: path
          required: true
          style: simple
          explode: false
          schema:
            type: string
      responses:
        default:
          description: Default response
