openapi: 3.0.1
info:
  title: policies-api
  description: API Definition of policies-api
  version: 1.0.0
servers:
  - url: http://localhost:8290/policies-api
paths:
  /policies:
    get:
      responses:
        default:
          description: Default response
  /policy/{policy_id}:
    get:
      parameters:
        - name: policy_id
          in: path
          required: true
          schema:
            type: string
      responses:
        default:
          description: Default response
    put:
      parameters:
        - name: policy_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        description: Sample Payload
        content:
          application/json:
            schema:
              type: object
              properties:
                payload:
                  type: object
          application/xml:
            schema:
              type: object
              xml:
                name: payload
        required: false
      responses:
        default:
          description: Default response
    patch:
      parameters:
        - name: policy_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        description: Fields to update (status and/or next_due_date)
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [Active, Expired, Cancelled, Inactive]
                next_due_date:
                  type: string
                  format: date
                  example: "2025-03-01"
        required: true
      responses:
        default:
          description: Default response
    delete:
      parameters:
        - name: policy_id
          in: path
          required: true
          schema:
            type: string
      responses:
        default:
          description: Default response
  /policies/customer/{customer_id}:
    get:
      parameters:
        - name: customer_id
          in: path
          required: true
          schema:
            type: string
      responses:
        default:
          description: Default response
  /policy:
    post:
      requestBody:
        description: Sample Payload
        content:
          application/json:
            schema:
              type: object
              properties:
                payload:
                  type: object
          application/xml:
            schema:
              type: object
              xml:
                name: payload
        required: false
      responses:
        default:
          description: Default response
  /policies/count:
    get:
      responses:
        default:
          description: Default response
  /policies/count/employee/{employee_id}:
    get:
      parameters:
        - name: employee_id
          in: path
          required: true
          schema:
            type: string
      responses:
        default:
          description: Default response
  /policies/employee/{employee_id}:
    get:
      parameters:
        - name: employee_id
          in: path
          required: true
          schema:
            type: string
      responses:
        default:
          description: Default response
  /customers/count/employee/{employee_id}:
    get:
      parameters:
        - name: employee_id
          in: path
          required: true
          schema:
            type: string
      responses:
        default:
          description: Default response
